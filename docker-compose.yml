services:
  bettercad:
    image: ghcr.io/kevinmcaleer/bettercad:latest
    build: .
    restart: unless-stopped
    # No published port: only the tunnel below reaches it, over this project's Docker network, at http://bettercad:8000.
    # To open it on this machine for a quick look, see docs/deploy.md ("Reaching it locally").
    volumes:
      - bettercad-data:/data
      # Nightly backups (#87): the database and import files, one folder per day, 14 days kept.
      - ${BACKUP_PATH:-./backups}:/backups
    environment:
      # Signs sessions. Required: the server refuses to start in production without it.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      # Where the SQLite database and uploads live (the volume above).
      DATA_DIR: /data
      # Largest saved model, in megabytes. Keep the reverse proxy's body limit at least this big.
      MAX_UPLOAD_MB: "50"
      # Storage each account may use, in megabytes.
      USER_QUOTA_MB: ${USER_QUOTA_MB:-500}
      BACKUP_DIR: /backups
      # Only used for CORS outside production; the app is same-origin behind the proxy.
      ALLOWED_ORIGINS: https://bettercad.kevsrobots.com

  # The Cloudflare Tunnel that serves bettercad.kevsrobots.com. Starts with the app; needs CLOUDFLARE_TUNNEL_TOKEN
  # in .env. In the Zero Trust dashboard, the tunnel's public hostname bettercad.kevsrobots.com points at
  # http://bettercad:8000. To run the app on its own: docker compose up -d bettercad
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env, or start only the app with docker compose up -d bettercad}"
    depends_on:
      bettercad:
        condition: service_healthy

volumes:
  bettercad-data:
