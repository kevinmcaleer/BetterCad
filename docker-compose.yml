services:
  bettercad:
    # latest is the last version tag; set BETTERCAD_TAG=main in .env to follow every merge to main (docs/deploy.md).
    image: ghcr.io/kevinmcaleer/bettercad:${BETTERCAD_TAG:-latest}
    build: .
    restart: unless-stopped
    labels:
      # Only this container is updated by the watchtower service below, never cloudflared or anything else on the host.
      com.centurylinklabs.watchtower.enable: "true"
    # No published port: only the tunnel below reaches it, over this project's Docker network, at http://bettercad:8000.
    # To open it on this machine for a quick look, see docs/deploy.md ("Reaching it locally").
    volumes:
      - bettercad-data:/data
      # Nightly backups (#87): the database and import files, one folder per day, 14 days kept.
      - ${BACKUP_PATH:-./backups}:/backups
    environment:
      # Signs sessions. Required: the server refuses to start in production without it.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      # Where the SQLite database and uploads live (the volume above).
      DATA_DIR: /data
      # Largest saved model, in megabytes. Keep the reverse proxy's body limit at least this big.
      MAX_UPLOAD_MB: "50"
      # Storage each account may use, in megabytes.
      USER_QUOTA_MB: ${USER_QUOTA_MB:-500}
      BACKUP_DIR: /backups
      # Only used for CORS outside production; the app is same-origin behind the proxy.
      ALLOWED_ORIGINS: https://bettercad.kevsrobots.com
      # Sign-in is your kevsrobots.com account (docs/accounts.md): its cookie is set on .kevsrobots.com, and
      # BetterCad asks Chatter who it belongs to.
      CHATTER_URL: ${CHATTER_URL:-https://chatter.kevsrobots.com}
      # Optional: Chatter's address from inside Docker, so sign-in checks skip Cloudflare (docs/deploy.md).
      CHATTER_API_URL: ${CHATTER_API_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.kevsrobots.com}
      # kevsrobots.com sends people back here after signing in. Problem reports email through the SMTP server below.
      PUBLIC_URL: ${PUBLIC_URL:-https://bettercad.kevsrobots.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

  # The Cloudflare Tunnel that serves bettercad.kevsrobots.com. Starts with the app; needs CLOUDFLARE_TUNNEL_TOKEN
  # in .env. In the Zero Trust dashboard, the tunnel's public hostname bettercad.kevsrobots.com points at
  # http://bettercad:8000. To run the app on its own: docker compose up -d bettercad
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env, or start only the app with docker compose up -d bettercad}"
    depends_on:
      bettercad:
        condition: service_healthy

  # Pulls a new BetterCad image when one is published and restarts the app on it. Off unless .env has
  # COMPOSE_PROFILES=autoupdate. Checks every 5 minutes and removes the old image.
  watchtower:
    image: nickfedor/watchtower:1.24.1
    profiles: [autoupdate]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"

volumes:
  bettercad-data:
