name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts a pull request touches. A pull request that only changes docs, server code or Markdown skips the
  # app's checks: the jobs below still report (skipped jobs count as passing), so required checks never block it.
  # Pushes to main always run everything, and if this job fails the app's checks run too ("app" is never "false").
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - id: files
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "pull_request") return core.setOutput("app", "true");
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Paths the app, its tests and its build never read. THIRD_PARTY_LICENSES.md is read by a unit test.
            const appIgnores = (f) =>
              /^(docs|server|deploy)\//.test(f) ||
              /^\.github\/(ISSUE_TEMPLATE\/|pull_request_template\.md$|labels\.yml$)/.test(f) ||
              (f.endsWith(".md") && f !== "THIRD_PARTY_LICENSES.md");
            const names = files.flatMap((f) => [f.filename, f.previous_filename].filter(Boolean));
            const app = files.length >= 3000 || names.some((f) => !appIgnores(f));
            core.setOutput("app", String(app));
            await core.summary
              .addRaw(app ? "This change touches the app, so every check runs." : "Docs, server or Markdown only: the app's checks are skipped.")
              .write();

  web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # First-paint JavaScript under 355 KB gzipped and no dev-only code in the release build (#97).
      - run: npm run size -w web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # The end-to-end tests, split test by test across three runners (fullyParallel) so each takes a third of the
  # suite. Each shard builds the gallery preview itself (Playwright's webServer) while the web job lints and tests. The shards always start, so their checks keep their names; on a docs, server or Markdown
  # only pull request every step is skipped and the shard passes in seconds.
  e2e:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (${{ matrix.shard }} of 3)
    env:
      RUN: ${{ needs.changes.outputs.app != 'false' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v4
      - if: env.RUN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.RUN == 'true'
        run: npm ci
      - if: env.RUN == 'true'
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The runner image already has Chrome's system libraries, so skip install-deps (minutes of apt font downloads).
      # Headless shell only; a cache hit makes this a no-op.
      - if: env.RUN == 'true'
        run: npx playwright install --only-shell chromium
      - if: env.RUN == 'true'
        run: npm run e2e -w web -- --shard=${{ matrix.shard }}/3
        env:
          CI: "1"
      # Each test's last screenshot, so a failed run is easy to read.
      - if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore
      - if: env.RUN != 'true'
        run: echo "Docs, server or Markdown only, so the browser tests are skipped."

  # Tests tagged @quarantine (#107): flaky until fixed. They run here so they stay visible, but never block a merge.
  quarantine:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --only-shell chromium
      - run: npm run e2e:quarantine -w web
        env:
          CI: "1"

  # Geometry goldens (#106): kernel, sketch and timeline, with what moved and the time per case in the job summary.
  golden:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:golden -- --reporter=default --reporter=json --outputFile=golden-report.json
        env:
          GOLDEN_SUMMARY: ${{ runner.temp }}/golden-moved.md
      - if: always()
        run: node scripts/test-report.mjs golden-report.json "Geometry goldens" "$RUNNER_TEMP/golden-moved.md" >> "$GITHUB_STEP_SUMMARY"

  # Performance budgets (#108): bundle and WASM sizes, kernel and viewport benchmarks against the runner's own
  # baselines, and Lighthouse on the release build. budgets.json holds the numbers; one PR comment shows the table.
  budgets:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run bench:kernel -- --ci --json kernel-bench.json
      # The release build for sizes and Lighthouse; a gallery build beside it for the viewport bench's test hook.
      - run: npm run build
      - run: VITE_GALLERY=1 npx vite build --outDir dist-gallery
        working-directory: web
      - name: Viewport bench
        working-directory: web
        run: |
          npx vite preview --outDir dist-gallery --port 4174 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          node ../scripts/bench-viewport.mjs http://127.0.0.1:4174/ --json ../viewport-bench.json
      - name: Lighthouse
        working-directory: web
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") \
            npx -y lighthouse@11.7.1 http://127.0.0.1:4173/ --preset=desktop --only-categories=performance,pwa \
            --chrome-flags="--headless=new --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader" \
            --output=json --output-path=../lighthouse.json --quiet
      - run: node scripts/budgets.mjs --kernel kernel-bench.json --viewport viewport-bench.json --lighthouse lighthouse.json
      - if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("budgets-report.md")) return;
            const body = fs.readFileSync("budgets-report.md", "utf8");
            const pr = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr, per_page: 100 });
            const mine = comments.find((c) => c.user.type === "Bot" && c.body.startsWith("<!-- budgets -->"));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });

  # Screenshot tests (@visual). Baselines come from this Linux runner so fonts match: on a pull request from this
  # repository, any missing baseline is written and committed back to the branch, then everything is compared.
  screenshots:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The runner image already has Chrome's system libraries, so skip install-deps (minutes of apt font downloads).
      # Headless shell only; a cache hit makes this a no-op.
      - run: npx playwright install --only-shell chromium
      - name: Write any missing baselines
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npm run e2e:visual -- --update-snapshots=missing || true
        env:
          CI: "1"
      - name: Commit new baselines
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add web/e2e/*-snapshots
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add screenshot baselines from CI"
          git push origin HEAD:${{ github.head_ref }}
      - run: npm run e2e:visual
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: web/test-results
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    env:
      UV_VERSION: "0.11.32"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # Python from the runner's tool cache, so uv never has to download one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned so setup-uv skips the "latest" lookup. GitHub release downloads
      # sometimes 504; if they do, fall back to PyPI below.
      - id: setup-uv
        uses: astral-sh/setup-uv@v6
        continue-on-error: true
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: server
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install uv from PyPI (fallback)
        if: steps.setup-uv.outcome == 'failure'
        run: |
          for attempt in 1 2 3; do
            python -m pip install "uv==$UV_VERSION" && break
            sleep $((attempt * 10))
          done
          uv --version
          echo "UV_PYTHON=3.13" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=bettercad
      - name: Every runtime dependency is in THIRD_PARTY_LICENSES.md
        run: node ../scripts/third-party.mjs --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64 here; release.yml also builds arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bettercad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image is under 300 MB
        run: |
          size=$(docker image inspect bettercad:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((300 * 1024 * 1024))
      - name: Container starts, serves the app and reports healthy
        run: |
          docker run -d --name bc -p 8000:8000 -e SECRET_KEY=ci bettercad:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS localhost:8000/api/health | grep '"ok":true'
          curl -fsS localhost:8000/ | grep -q '<title>BetterCad</title>'
          curl -fsSI localhost:8000/ | grep -i 'cross-origin-embedder-policy: require-corp'
          docker exec bc id -u | grep -v '^0$'
          docker logs bc
