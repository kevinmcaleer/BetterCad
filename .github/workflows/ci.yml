name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # First-paint JavaScript under 350 KB gzipped and no dev-only code in the release build (#97).
      - run: npm run size -w web
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The runner image already has Chrome's system libraries, so skip install-deps (minutes of apt font downloads).
      # Headless shell only; a cache hit makes this a no-op.
      - run: npx playwright install --only-shell chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
      # Each test's last screenshot, so a failed run is easy to read.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Tests tagged @quarantine (#107): flaky until fixed. They run here so they stay visible, but never block a merge.
  quarantine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --only-shell chromium
      - run: npm run e2e:quarantine -w web
        env:
          CI: "1"

  # Geometry goldens (#106): kernel, sketch and timeline, with what moved and the time per case in the job summary.
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:golden -- --reporter=default --reporter=json --outputFile=golden-report.json
        env:
          GOLDEN_SUMMARY: ${{ runner.temp }}/golden-moved.md
      - if: always()
        run: node scripts/test-report.mjs golden-report.json "Geometry goldens" "$RUNNER_TEMP/golden-moved.md" >> "$GITHUB_STEP_SUMMARY"

  # Screenshot tests (@visual). Baselines come from this Linux runner so fonts match: on a pull request from this
  # repository, any missing baseline is written and committed back to the branch, then everything is compared.
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The runner image already has Chrome's system libraries, so skip install-deps (minutes of apt font downloads).
      # Headless shell only; a cache hit makes this a no-op.
      - run: npx playwright install --only-shell chromium
      - name: Write any missing baselines
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npm run e2e:visual -- --update-snapshots=missing || true
        env:
          CI: "1"
      - name: Commit new baselines
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add web/e2e/*-snapshots
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add screenshot baselines from CI"
          git push origin HEAD:${{ github.head_ref }}
      - run: npm run e2e:visual
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: web/test-results
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=bettercad

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64 here; release.yml also builds arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bettercad:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image is under 300 MB
        run: |
          size=$(docker image inspect bettercad:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((300 * 1024 * 1024))
      - name: Container starts, serves the app and reports healthy
        run: |
          docker run -d --name bc -p 8000:8000 -e SECRET_KEY=ci bettercad:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS localhost:8000/api/health | grep '"ok":true'
          curl -fsS localhost:8000/ | grep -q '<title>BetterCad</title>'
          curl -fsSI localhost:8000/ | grep -i 'cross-origin-embedder-policy: require-corp'
          docker exec bc id -u | grep -v '^0$'
          docker logs bc
