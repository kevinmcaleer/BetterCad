# Publishes a live preview of the web app to GitHub Pages on every push to main
# (and on demand). This is only a preview: bettercad.kevsrobots.com is served from
# the Docker image (docs/deploy.md), not from Pages.
#
# Off until you turn it on, so main stays green: set Settings → Pages → Source:
# GitHub Actions, then add the repository variable PAGES_PREVIEW = true
# (Settings → Secrets and variables → Actions → Variables). Run it by hand any time.
name: Preview on Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_PREVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GALLERY: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
