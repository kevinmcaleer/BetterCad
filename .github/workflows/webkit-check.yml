name: WebKit check (temporary)
on:
  push:
    branches: [claude/project-thread-8sciai]
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run e2e -- --project=webkit
        env:
          CI: "1"
          PW_WEBKIT: "1"
      - if: failure()
        run: for f in web/test-results/*/error-context.md; do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
