# Reverse proxy for BetterCad. The hostname is a placeholder until Kev picks one (#21).
# Certificates: certbot --nginx -d bettercad.kevsrobots.com (renews by its own timer).
server {
    listen 80;
    server_name bettercad.kevsrobots.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bettercad.kevsrobots.com;

    ssl_certificate     /etc/letsencrypt/live/bettercad.kevsrobots.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettercad.kevsrobots.com/privkey.pem;

    client_max_body_size 60m;  # at least MAX_UPLOAD_MB

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
