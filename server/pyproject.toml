[project]
name = "bettercad"
version = "0.1.0"
description = "BetterCad's server: accounts and saved models. The editor and kernel run in the browser."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.1",
  "httpx>=0.28",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bettercad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
